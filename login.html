
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartShop | Login</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <header>
    <a class="brand logo" href="index.html">
      <span class="logo-mark"><span class="logo-letter">S</span></span>
      <span class="logo-text">SmartShop</span>
    </a>
    <a class="back" href="index.html">← Back to Shop</a>
  </header>

  <main class="container">
    <section class="card">
      <div class="icon"><span>S</span></div>
      <h1 id="heading">Welcome Back!</h1>
      <p class="subtitle" id="subtitle">Login to your SmartShop account</p>

      <div class="tabs">
        <button class="tab active" id="loginTab" type="button">Login</button>
        <button class="tab" id="signupTab" type="button">Sign Up</button>
      </div>

      <form id="authForm">
        <div class="field" id="nameField" hidden>
          <label for="name">Full Name</label>
          <input id="name" type="text" placeholder="Enter your name">
        </div>

        <div class="field">
          <label for="email">Email Address</label>
          <input id="email" type="email" placeholder="you@example.com" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="passwordBox">
            <input id="password" type="password" placeholder="At least 6 characters" minlength="6" required>
            <button type="button" id="togglePassword">Show</button>
          </div>
        </div>

        <p id="message" role="status"></p>
        <button class="submit" id="submitBtn" type="submit">Login</button>
      </form>

      <p class="switchText" id="switchText">
        Don't have an account?
        <button type="button" id="switchBtn">Sign Up</button>
      </p>
      <p class="note">Demo interface · No real account is created</p>
    </section>
  </main>

  <script src="login.js"></script>
</body>
</html>
