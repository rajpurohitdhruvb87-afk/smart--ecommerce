<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartShop | Products</title>
    <link rel="stylesheet" href="style.css.css">
</head>
<body>

<header class="header">
    <a href="index.html" class="brand" aria-label="SmartShop home">
        <span class="logo-mark"><span class="logo-letter">S</span></span>
        <span class="logo-text">SmartShop</span>
    </a>

    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="about.html">About</a>
        <a href="login.html">Login / Sign Up</a>
    </nav>

    <div class="header-buttons">
        <button id="themeBtn" class="icon-btn">🌙</button>
        <button id="cartBtn" class="cart-btn">
            🛒 Cart <span id="cartCount">0</span>
        </button>
    </div>
</header>

<section id="products" class="products-section">
    <h2>Our Products</h2>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="Search products...">
        <select id="categoryFilter">
            <option value="all">All Categories</option>
            <option value="electronics">Electronics</option>
            <option value="fashion">Fashion</option>
            <option value="accessories">Accessories</option>
        </select>
    </div>

    <div id="productContainer" class="product-container"></div>
</section>

<div id="cartModal" class="modal">
    <div class="modal-content">
        <button id="closeCart" class="close-btn">&times;</button>
        <h2>Your Cart</h2>
        <div id="cartItems"></div>
        <div class="cart-total">
            <strong>Total:</strong>
            <span>₹<span id="cartTotal">0</span></span>
        </div>
        <button id="checkoutBtn" class="primary-btn">Proceed to Checkout</button>
    </div>
</div>

<section id="checkoutSection" class="checkout-section">
    <div class="checkout-box">
        <h2>Checkout</h2>
        <form id="checkoutForm">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="Enter your phone number" required>

            <label for="address">Address</label>
            <textarea id="address" placeholder="Enter your address" required></textarea>

            <label for="payment">Payment Method</label>
            <select id="payment" required>
                <option value="">Select Payment Method</option>
                <option value="cod">Cash on Delivery</option>
                <option value="upi">UPI</option>
                <option value="card">Credit/Debit Card</option>
            </select>

            <button type="submit" class="primary-btn">Place Order</button>
        </form>
    </div>
</section>

<div id="successModal" class="modal">
    <div class="modal-content success-box">
        <div class="success-icon">✓</div>
        <h2>Order Placed Successfully!</h2>
        <p>Thank you for shopping with SmartShop.</p>
        <p>Your order has been received successfully.</p>
        <button id="continueBtn" class="primary-btn">Continue Shopping</button>
    </div>
</div>

<footer>
    <p>&copy; 2026 SmartShop. All Rights Reserved.</p>
    <p>Created by BHAVANISINGH RAJPUROHIT</p>
</footer>

<script src="script.js.js"></script>
</body>
</html>
